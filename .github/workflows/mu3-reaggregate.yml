name: mu3 reaggregate

on:
  push:
    branches:
      - research/reaggregate-after-tail-closure
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -e '.[dev,graph,sat]'
      - name: Recompute aggregate bound
        run: python -m order15_mu3.scripts.verify_aggregate_upper
      - name: Run aggregate and tail tests
        run: pytest -q tests/test_mu3_aggregate_upper.py tests/test_mu3_tail_final_closure.py
