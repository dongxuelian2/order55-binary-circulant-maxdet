[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "order55-binary-circulant-maxdet"
version = "1.0.0"
description = "Exact verification code for the maximum determinant of a 55x55 binary circulant matrix"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sympy>=1.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
